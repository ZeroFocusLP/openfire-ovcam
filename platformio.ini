; ============================================================================
; openfire-ov2640-overlay — unmodified OpenFIRE firmware + an OV2640 camera
; backend for ESP32-S3, in place of the usual DFRobot/PAJ7025 IR camera.
; ----------------------------------------------------------------------------
; LAYOUT: OpenFIRE lives in ./OpenFIRE-Firmware-ESP32 (git clone, NEVER
; edited). This project builds THEIR sources from OUR project root:
;   src_dir        -> their lightgun/src
;   boards_dir     -> their shared_boards
;   lib_extra_dirs -> their lightgun/lib + shared_lib
;   our lib/ SHADOWS their DFRobotIRPositionEx because project-local libs
;   outrank lib_extra_dirs. Their tree stays byte-identical: update = git
;   pull, rebuild.
;
; SETUP (once) — see README.md:
;   git clone https://github.com/alessandro-satanassi/OpenFIRE-Firmware-ESP32.git
;
; Their camera libs must not be seen by the LDF ahead of ours; lib_ignore
; below handles that without touching their tree.
; ============================================================================
[platformio]
default_envs = combined_s3_freenove
src_dir = OpenFIRE-Firmware-ESP32/lightgun/src
boards_dir = OpenFIRE-Firmware-ESP32/shared_boards

[common]
base_flags =
    ; Pin the camera driver's copy-task to core 1. Without this (and without
    ; CONFIG_CAMERA_CORE*) cam_hal uses xTaskCreate() and FreeRTOS may migrate
    ; the task between cores mid-frame, which measurably worsens detection.
    -D PATCH_CAM_TASK_CORE1
    -D GUN
    -D USE_TINYUSB
    -D CUSTOM_NEOPIXEL
    -D FOURPIN_LED
    -D DUAL_CORE
    -D MAMEHOOKER
    -D USES_ANALOG
    -D USE_MULTI_ONE_EURO_FILTER
    -D USE_PERSPECTIVE_ADVANCED
    -D USE_SQUARE_ADVANCED
    -D USES_SOLENOID
    -D USES_RUMBLE
    ; ---- wiring: adjust these to YOUR gun -----------------------------------
    -D SOLENOID_PIN=21
    -D RUMBLE_PIN=14
    -D BTN_TRIGGER_PIN=1
    -D BTN_A_PIN=2
    ; -------------------------------------------------------------------------
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; WARN-level driver logs. Without this the camera driver's FB-OVF /
    ; frame-rejected warnings are silently discarded and capture faults are
    ; invisible. The driver rate-limits them, so UART traffic stays negligible.
    -D CORE_DEBUG_LEVEL=2
    ; Camera ISRs into IRAM + registered with ESP_INTR_FLAG_IRAM. Without this
    ; the VSYNC/DMA ISRs are flash-resident and MASKED during every
    ; flash-cache-disable window (the combined build writes LittleFS at
    ; runtime). Measured on hardware: 3-4x fewer capture faults and +40 fps
    ; with the flag on. Do not remove.
    -D CONFIG_LCD_CAM_ISR_IRAM_SAFE=1
    -O2
    ; ===== DIAGNOSTIC SWITCH =================================================
    ; 0 = shipping build. Per-second telemetry, dashboard stream, UART0 tune
    ;     console and per-frame jump meter are compiled out.
    ; 1 = diagnostic build. All of it is back; tools/dashboard.py and
    ;     tools/health.py work -> use `pio run -e diag`, do not edit this.
    ; Kept in BOTH builds: the framebuffer drain task (load-bearing) and the
    ; one-line boot banner (stale-build check; prints SHIP or DIAG).
    -D LIGHTGUN_DIAG=0
display_flags =
    -D USES_DISPLAY
    -D USE_LOVYAN_GFX
wireless_flags =
    -D OPENFIRE_WIRELESS_ENABLE
    -D OPENFIRE_WIRELESS_DEVICE_ESPNOW
    -D OPENFIRE_AUTO_CHANNEL_ESPNOW_WIFI
    -D OPENFIRE_USE_ESPNOW_UNIFIED_PACKET

; ============================ SHIPPING BUILD ================================
[env:combined_s3_freenove]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.39
board = ESP32-S3-WROOM-1-DevKitC-1-N8R2
; The Freenove ESP32-S3-WROOM CAM is an N8R8: 8MB flash + 8MB OCTAL PSRAM.
; The N8R2 board def above assumes QUAD PSRAM, so without this override PSRAM
; fails to init on every boot ("PSRAM chip is not connected") and ~8MB of heap
; silently vanishes. qio_opi sets the octal line mode; the boot banner's MEM
; line (diag build) positively confirms PSRAM is alive.
board_build.arduino.memory_type = qio_opi
framework = arduino
monitor_speed = 115200
lib_extra_dirs =
    OpenFIRE-Firmware-ESP32/lightgun/lib
    OpenFIRE-Firmware-ESP32/shared_lib
lib_ignore = DFRobotIRPositionEx, DFRobotIRPositionEx_Wrapper, PixArt_PAJ7025
lib_deps =
    Adafruit TinyUSB Library = https://github.com/adafruit/Adafruit_TinyUSB_Arduino.git#3.7.7
    Adafruit BusIO = https://github.com/adafruit/Adafruit_BusIO.git#1.17.4
    Adafruit GFX Library = https://github.com/adafruit/Adafruit-GFX-Library.git#1.12.6
    Adafruit SSD1306 = https://github.com/adafruit/Adafruit_SSD1306.git#2.5.17
    Adafruit NeoPixel = https://github.com/adafruit/Adafruit_NeoPixel.git#1.15.5
    LovyanGFX Library = https://github.com/lovyan03/LovyanGFX.git#1.2.25
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    ${common.base_flags}
    ${common.display_flags}
    ${common.wireless_flags}
    -D CAMERA_MODEL_FREENOVE_ESP32S3_CAM=1
    -D NEOPIXEL_PIN=48
board_build.partitions = OpenFIRE-Firmware-ESP32/shared_boards/partitions/default_OF_8MB.csv
board_build.filesystem = littlefs
lib_ldf_mode = chain

; ============================ FREENOVE DIAGNOSTIC ============================
[env:diag_s3_freenove]
extends = env:combined_s3_freenove
build_flags =
    ${common.base_flags}
    ${common.display_flags}
    ${common.wireless_flags}
    -D CAMERA_MODEL_FREENOVE_ESP32S3_CAM=1
    -D NEOPIXEL_PIN=48
    -D LIGHTGUN_DIAG=1
build_unflags = -DARDUINO_USB_MODE=1 -D LIGHTGUN_DIAG=0

; Backward compatibility alias
[env:diag]
extends = env:diag_s3_freenove

; ============================ SEEED XIAO ESP32S3 SENSE =======================
; Shipping build for Seeed Studio XIAO ESP32S3 Sense (with OV2640 / OV3660 / OV5640)
[env:combined_xiao_s3_sense]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.39
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_extra_dirs =
    OpenFIRE-Firmware-ESP32/lightgun/lib
    OpenFIRE-Firmware-ESP32/shared_lib
lib_ignore = DFRobotIRPositionEx, DFRobotIRPositionEx_Wrapper, PixArt_PAJ7025
lib_deps =
    Adafruit TinyUSB Library = https://github.com/adafruit/Adafruit_TinyUSB_Arduino.git#3.7.7
    Adafruit BusIO = https://github.com/adafruit/Adafruit_BusIO.git#1.17.4
    Adafruit GFX Library = https://github.com/adafruit/Adafruit-GFX-Library.git#1.12.6
    Adafruit SSD1306 = https://github.com/adafruit/Adafruit_SSD1306.git#2.5.17
    Adafruit NeoPixel = https://github.com/adafruit/Adafruit_NeoPixel.git#1.15.5
    LovyanGFX Library = https://github.com/lovyan03/LovyanGFX.git#1.2.25
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    ${common.base_flags}
    ${common.display_flags}
    ${common.wireless_flags}
    -D CAMERA_MODEL_XIAO_ESP32S3=1
    -D NEOPIXEL_PIN=43
    -D OV_DASH_NO_UART0_RX=1
    -D MILLIS_TIMEOUT=4000
board_build.partitions = OpenFIRE-Firmware-ESP32/shared_boards/partitions/default_OF_8MB.csv
board_build.filesystem = littlefs
lib_ldf_mode = chain

; Diagnostic build for Seeed Studio XIAO ESP32S3 Sense
[env:diag_xiao_s3_sense]
extends = env:combined_xiao_s3_sense
build_flags =
    ${common.base_flags}
    ${common.display_flags}
    ${common.wireless_flags}
    -D CAMERA_MODEL_XIAO_ESP32S3=1
    -D NEOPIXEL_PIN=43
    -D OV_DASH_NO_UART0_RX=1
    -D MILLIS_TIMEOUT=4000
    -D LIGHTGUN_DIAG=1
build_unflags = -DARDUINO_USB_MODE=1 -D LIGHTGUN_DIAG=0

