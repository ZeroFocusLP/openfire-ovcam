; Camera-stack harness — flashes the capture stack ALONE (no OpenFIRE) so the
; camera path can be hardware-validated first. Expect the boot banner, then
; steady per-second telemetry at HQVGA grayscale (~134 fps).
; Build from harness/:  pio run -t upload
; The lib is symlink-free: it lives in ../lib and is pulled via lib_extra_dirs.
[env:s3harness]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.39
board = ESP32-S3-WROOM-1-DevKitC-1-N8R2
framework = arduino
lib_extra_dirs = ../lib
; PATCH_CAM_TASK_CORE1 matches the combined build's core affinity, so
; harness-vs-combined comparisons stay controlled. LIGHTGUN_DIAG=1 always:
; the harness IS the instrument.
build_flags = -O2 -D LIGHTGUN_DIAG=1 -D PATCH_CAM_TASK_CORE1 -D CORE_DEBUG_LEVEL=2
; Same PSRAM fix as the combined build: the board def is N8R2 (quad PSRAM)
; but the Freenove hardware is N8R8 (octal). Without this, PSRAM is dead.
board_build.arduino.memory_type = qio_opi

[platformio]
boards_dir = boards
